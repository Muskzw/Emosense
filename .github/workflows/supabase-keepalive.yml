name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity.
# This pings the project every 3 days so emosense_db stays awake.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is missing"; exit 1
          fi
          # Real read on a table; falls back to the auth health check if RLS blocks anon reads.
          if curl -fsS "$SUPABASE_URL/rest/v1/collected_samples?select=id&limit=1" \
               -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -o /dev/null; then
            echo "Table read OK"
          else
            curl -fsS "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
            echo "Auth health OK"
          fi
