name: EmoSense Continuous Retraining MLOps Pipeline

on:
  schedule:
    # Run automatically at midnight UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggers from the GitHub Actions UI tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrain-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Check out repository
      uses: actions/checkout@v4

    - name: 2. Set up Python (v3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 3. Install Machine Learning & Database dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary numpy tensorflow tensorflowjs

    - name: 4. Sync new face samples from Supabase
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python backend/sync_supabase.py

    - name: 5. Retrain CNN Model in the Cloud
      run: |
        python backend/train_model.py

    - name: 6. Patch & Compile Keras model to TensorFlow.js
      run: |
        python patch_keras_model.py
        python convert_emosense_model.py

    - name: 7. Commit new model weights and push to trigger Render deploy
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Stage the compiled static model files
        git add frontend/public/models/emosense-model/
        
        # Commit and push only if the model weights actually changed
        if git diff --cached --quiet; then
          echo "No new model weight changes detected. Skipping push."
        else
          git commit -m "chore(mlops): auto-retrained custom model weights [skip ci]"
          git push
        fi
