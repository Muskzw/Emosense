services:
  - type: web
    name: emosense
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Optional TURN server credentials for production
      # - key: TURN_URL
      #   value: turn:your-turn-server.com:3478
      # - key: TURN_USERNAME
      #   value: user
      # - key: TURN_PASSWORD
      #   value: pass
